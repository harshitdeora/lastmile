name: Verify LastMile
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d --wait falkordb
      - run: pip install -r backend/requirements.lock.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local API and frontend for browser verification
        run: |
          PYTHONPATH=backend uvicorn app.api:app --host 127.0.0.1 --port 8000 --workers 1 > /tmp/lastmile-api.log 2>&1 &
          (cd frontend && npm run dev > /tmp/lastmile-ui.log 2>&1) &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ && curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
      - run: npm run test:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: docs/screenshots
